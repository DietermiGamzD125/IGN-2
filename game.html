<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Game Details</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="shared.css">
    </head>
    <body>

        <header>
        <div class="head_div">
            <img src="https://file.garden/YKFZIqs3-AHC5SlX/logo.png" width="60px">
            <h1 class="head_div">GameDirectory</h1>
        </div>
        <div class="head_div">
            <nav>
                <a href="index.html">Inicio</a>
                <a href="catalog.html">Reseñas</a>
                <a href="news.html">Noticias</a>
                <a href="lame.html">Contacto</a>
            </nav>  
        </div>
    </header>

        <h1 class="center" id="game-title"></h1>

        <div class="center">
            <div class="score-box">
                <h2 class="center" id="average-score"></h2>
            </div>
        </div>


        <!-- Review Form -->
        <div class="card" style="max-width: 600px; margin: 20px auto;">
            <h2 class="center">Write a Review</h2>

            <form id="review-form">
                <input
                    type="text"
                    id="review-name"
                    placeholder="Your name"
                    required
                    style="width: 100%; margin-bottom: 10px;"
                >

                <input
                    type="number"
                    id="review-score"
                    placeholder="Score (1-10)"
                    min="0"
                    max="10"
                    required
                    style="width: 100%; margin-bottom: 10px;"
                >

                <textarea
                    id="review-text"
                    placeholder="Write your review..."
                    required
                    style="width: 100%; height: 120px; margin-bottom: 10px;"
                ></textarea>

                <button type="submit">Submit Review</button>
            </form>

            <p id="form-message"></p>
        </div>

        <div class="grid" id="reviews-container"></div>

        <script type="module" src="game.js"></script>

    </body>
</html>
